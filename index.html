<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cosimo Miccoli – Art Direction &amp; Graphic Design</title>
  <meta name="description" content="Cosimo Miccoli – Art Direction & Graphic Design. Website under construction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js")</script>
  <style>
    /* Built from the Figma frame "Landing" (402 × 874) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #fff;
      color: #000;
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-weight: 400;
      line-height: 1.042;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .block {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      white-space: pre;
    }

    .clock {
      top: 17px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    /* "Website / under construction" sits 59px above the middle of the
       screen, the name and role right underneath */
    .title {
      top: calc(50% - 59px);
      font-size: 18px;
      text-transform: uppercase;
    }

    .name {
      top: calc(50% - 12px);
      font-size: 10px;
    }

    .legal {
      bottom: calc(24px + env(safe-area-inset-bottom));
      font-size: 10px;
      line-height: 1.3;
    }

    h1, h2 { font: inherit; }

    /* Words and letters are split by the script below */
    .w, .ch { display: inline-block; }
    .ch { will-change: transform; }

    /* Entrance: one word after another rises out of a blur */
    .js .w { opacity: 0; }
    .w.is-in {
      animation: word-in .9s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    @keyframes word-in {
      0%   { opacity: 0; transform: translateY(.7em); filter: blur(6px); color: #999; }
      45%  { opacity: 1; color: #999; }
      100% { opacity: 1; transform: none; filter: blur(0); color: #000; }
    }

    .js .w.is-done { opacity: 1; animation: none; }

    @media (prefers-reduced-motion: reduce) {
      .js .w { opacity: 1; }
      .w.is-in { animation: none; }
    }
  </style>
</head>
<body>
  <p class="block clock" data-clock>UTC+1 – 00:00:00</p>

  <h1 class="block title">Website
Under construction</h1>

  <h2 class="block name">Cosimo Miccoli
Art Direction &amp; Graphic Design</h2>

  <p class="block legal">©2026
P.IVA – 03373480734</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
    (function () {
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var clock = document.querySelector("[data-clock]");

      // ---------- Clock: Italian time (UTC+1, UTC+2 in summer) ----------
      var timeFmt, zoneFmt;
      try {
        timeFmt = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Rome", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
        });
        zoneFmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Rome", timeZoneName: "shortOffset" });
      } catch (e) {}

      function clockText() {
        var d = new Date();
        if (!timeFmt) return clock.textContent;
        var zone = "UTC+1";
        if (zoneFmt) {
          var part = zoneFmt.formatToParts(d).filter(function (p) { return p.type === "timeZoneName"; })[0];
          if (part) zone = part.value.replace("GMT", "UTC");
        }
        return zone + " – " + timeFmt.format(d);
      }

      var clockFrozen = false;
      function tick() {
        if (clockFrozen) return;
        var text = clockText();
        var chars = clock.querySelectorAll(".ch");
        if (chars.length === text.replace(/ /g, "").length) {
          // Same shape: update the letters in place, keeping the spans
          var k = 0;
          clock.setAttribute("aria-label", text);
          for (var i = 0; i < text.length; i++) {
            if (text[i] !== " ") chars[k++].textContent = text[i];
          }
        } else {
          split(clock, text);
          clock.querySelectorAll(".w").forEach(function (w) { w.classList.add("is-done"); });
        }
      }

      // ---------- Split text into words (for the entrance) and letters (for the fall) ----------
      function split(el, text) {
        text = text == null ? el.textContent : text;
        el.setAttribute("aria-label", text.replace(/\s+/g, " ").trim());
        el.textContent = "";
        text.split("\n").forEach(function (line, li) {
          if (li) el.appendChild(document.createTextNode("\n"));
          line.split(" ").forEach(function (word, wi) {
            if (wi) el.appendChild(document.createTextNode(" "));
            if (!word) return;
            var w = document.createElement("span");
            w.className = "w";
            w.setAttribute("aria-hidden", "true");
            for (var i = 0; i < word.length; i++) {
              var c = document.createElement("span");
              c.className = "ch";
              c.textContent = word[i];
              w.appendChild(c);
            }
            el.appendChild(w);
          });
        });
      }

      // Order of the entrance: title, name and role, clock, legal lines
      var order = [".title", ".name", ".clock", ".legal"].map(function (s) {
        return document.querySelector(s);
      });
      split(clock, clockText());
      order.forEach(function (el) { if (el !== clock) split(el); });
      setInterval(tick, 1000);

      var words = [];
      order.forEach(function (el) {
        Array.prototype.push.apply(words, el.querySelectorAll(".w"));
      });

      var entranceTimer = null;
      function finishEntrance() {
        clearTimeout(entranceTimer);
        words.forEach(function (w) { w.classList.remove("is-in"); w.classList.add("is-done"); });
      }

      if (reduceMotion) {
        finishEntrance();
      } else {
        var n = 0;
        var startEntrance = function () {
          entranceTimer = setTimeout(function next() {
            if (n >= words.length) return;
            var w = words[n++];
            w.classList.add("is-in");
            w.addEventListener("animationend", function () {
              w.classList.remove("is-in");
              w.classList.add("is-done");
            }, { once: true });
            // The two title words arrive slowly, the rest follow quicker
            entranceTimer = setTimeout(next, n < 3 ? 320 : 150);
          }, 250);
        };
        // Wait for the font so the words don't jump when it arrives
        var started = false;
        var go = function () { if (!started) { started = true; startEntrance(); } };
        if (document.fonts && document.fonts.ready) { document.fonts.ready.then(go); setTimeout(go, 600); }
        else go();
      }

      // ---------- Click: letters fall to the bottom with gravity; click again to rebuild ----------
      if (reduceMotion || !window.Matter) return;

      var M = window.Matter;
      var engine = null, letters = [], walls = [], raf = null;
      var state = "home"; // home | falling | returning

      function makeWalls() {
        var w = window.innerWidth, h = window.innerHeight, t = 200;
        return [
          M.Bodies.rectangle(w / 2, h + t / 2, w * 3, t, { isStatic: true, friction: 0.8 }),
          M.Bodies.rectangle(-t / 2, h / 2, t, h * 4, { isStatic: true }),
          M.Bodies.rectangle(w + t / 2, h / 2, t, h * 4, { isStatic: true })
        ];
      }

      function drop() {
        finishEntrance();
        clockFrozen = true;
        state = "falling";

        engine = M.Engine.create();
        engine.gravity.y = 1;
        engine.positionIterations = 10;
        engine.velocityIterations = 8;

        letters = Array.prototype.map.call(document.querySelectorAll(".ch"), function (el) {
          el.style.transform = "";
          var r = el.getBoundingClientRect();
          var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          // The box hugs the glyph a little tighter than the line box
          var bw = Math.max(2, r.width * 0.92), bh = Math.max(2, r.height * 0.7);
          var body = M.Bodies.rectangle(cx, cy, bw, bh, {
            friction: 0.6,
            frictionAir: 0.012,
            restitution: 0.25,
            density: 0.002,
            chamfer: { radius: Math.min(bw, bh) * 0.2 }
          });
          // A little nudge so they don't fall as one flat block
          M.Body.setVelocity(body, { x: (Math.random() - 0.5) * 1.2, y: -Math.random() * 1.5 });
          M.Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.08);
          return { el: el, body: body, x: cx, y: cy };
        });

        walls = makeWalls();
        M.Composite.add(engine.world, walls.concat(letters.map(function (l) { return l.body; })));

        var last = performance.now();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function loop(now) {
          var dt = Math.min(now - last, 34);
          last = now;
          // Two half steps per frame keep the small letters steady
          M.Engine.update(engine, dt / 2);
          M.Engine.update(engine, dt / 2);
          letters.forEach(function (l) {
            var p = l.body.position;
            l.el.style.transform =
              "translate(" + (p.x - l.x) + "px," + (p.y - l.y) + "px) rotate(" + l.body.angle + "rad)";
          });
          if (state === "falling") raf = requestAnimationFrame(loop);
        });
      }

      function rebuild() {
        state = "returning";
        cancelAnimationFrame(raf);
        var duration = 1100;
        var from = letters.map(function (l) {
          return { dx: l.body.position.x - l.x, dy: l.body.position.y - l.y, a: l.body.angle };
        });
        var delays = letters.map(function () { return Math.random() * 300; });
        var start = performance.now();
        function ease(t) { return 1 - Math.pow(1 - t, 4); }
        raf = requestAnimationFrame(function loop(now) {
          var done = true;
          letters.forEach(function (l, i) {
            var t = Math.min(1, Math.max(0, (now - start - delays[i]) / duration));
            if (t < 1) done = false;
            var k = 1 - ease(t);
            l.el.style.transform = k
              ? "translate(" + from[i].dx * k + "px," + from[i].dy * k + "px) rotate(" + from[i].a * k + "rad)"
              : "";
          });
          if (!done) { raf = requestAnimationFrame(loop); return; }
          M.Engine.clear(engine);
          engine = null;
          letters = [];
          state = "home";
          clockFrozen = false;
          tick();
        });
      }

      document.addEventListener("pointerdown", function (e) {
        if (e.button > 0) return;
        if (state === "home") drop();
        else if (state === "falling") rebuild();
      });

      window.addEventListener("resize", function () {
        if (state !== "falling") return;
        M.Composite.remove(engine.world, walls);
        walls = makeWalls();
        M.Composite.add(engine.world, walls);
      });
    })();
  </script>
</body>
</html>
