<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cosimo Miccoli – Art Direction &amp; Graphic Design</title>
  <meta name="description" content="Cosimo Miccoli – Art Direction & Graphic Design. Website under construction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js")</script>
  <style>
    /* Built from the Figma frame "Landing" (Page 2, 402 × 874) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: #fff;
      color: #fff;
      font-family: "Inter", system-ui, sans-serif;
      font-optical-sizing: auto;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.042;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2 { font: inherit; }

    /* Black panels, 16px from the sides; text 13px in, 11px down */
    .panel {
      position: fixed;
      left: 16px;
      right: 16px;
      padding: 11px 13px;
      background: #000;
      white-space: pre;
    }

    /* Same 16px gap from the top as from the sides */
    .panel--top   { top: calc(16px + env(safe-area-inset-top)); height: 132px; }
    .panel--name  { bottom: 162px; height: 67px; }
    .panel--legal { bottom: 0; height: 153px; }

    /* The ant walks in the white space between the panels */
    .ant {
      position: fixed;
      left: 0;
      top: 0;
      width: 40.61px;
      height: 40.61px;
      margin: -20.3px 0 0 -20.3px; /* positioned by its centre */
      cursor: pointer;
      will-change: transform;
      touch-action: none;
    }

    .ant img { display: block; width: 100%; height: 100%; pointer-events: none; }

    /* ---------- Entrance ---------- */

    /* Panels open like shutters: the top one downwards, the others upwards */
    .js .panel { clip-path: inset(0 0 100% 0); }
    .js .panel--name, .js .panel--legal { clip-path: inset(100% 0 0 0); }
    .js .panel.is-open {
      clip-path: inset(0 0 0 0);
      transition: clip-path 1s cubic-bezier(.76, 0, .24, 1);
    }

    /* Then the words rise out of a blur, one after another */
    .w { display: inline-block; }
    .js .w { opacity: 0; }
    .w.is-in { animation: word-in .9s cubic-bezier(.16, 1, .3, 1) forwards; }
    .js .w.is-done { opacity: 1; animation: none; }

    @keyframes word-in {
      0%   { opacity: 0; transform: translateY(.7em); filter: blur(6px); color: #777; }
      45%  { opacity: 1; color: #777; }
      100% { opacity: 1; transform: none; filter: blur(0); color: #fff; }
    }

    .js .ant { opacity: 0; }
    .js .ant.is-on { opacity: 1; transition: opacity .4s; }

    @media (prefers-reduced-motion: reduce) {
      .js .panel { clip-path: none; }
      .js .w { opacity: 1; }
      .w.is-in { animation: none; }
      .js .ant { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1 class="panel panel--top">Website under construction</h1>

  <h2 class="panel panel--name">Cosimo Miccoli
Art Direction &amp; Graphic Design</h2>

  <p class="panel panel--legal">©2026</p>

  <div class="ant" aria-hidden="true"><img src="img/ant.svg" alt=""></div>

  <script>
    (function () {
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var panels = Array.prototype.slice.call(document.querySelectorAll(".panel"));

      // ---------- Split the texts into words ----------
      panels.forEach(function (el) {
        var text = el.textContent;
        el.setAttribute("aria-label", text.replace(/\s+/g, " ").trim());
        el.textContent = "";
        text.split("\n").forEach(function (line, li) {
          if (li) el.appendChild(document.createTextNode("\n"));
          line.split(" ").forEach(function (word, wi) {
            if (wi) el.appendChild(document.createTextNode(" "));
            if (!word) return;
            var w = document.createElement("span");
            w.className = "w";
            w.setAttribute("aria-hidden", "true");
            w.textContent = word;
            el.appendChild(w);
          });
        });
      });

      var words = [];
      panels.forEach(function (el) { Array.prototype.push.apply(words, el.querySelectorAll(".w")); });

      // ---------- The ant ----------
      var antEl = document.querySelector(".ant");
      // In the drawing the head points down and to the right
      var DRAWING_HEADING = 35 * Math.PI / 180;
      var ant = { x: 0, y: 0, heading: Math.PI, speed: 0, target: null, pause: 0, phase: 0, flee: 0 };
      var pointer = null;

      // Where the ant may walk: the white band between the panels
      function zone() {
        var top = document.querySelector(".panel--top").getBoundingClientRect().bottom;
        var bottom = document.querySelector(".panel--name").getBoundingClientRect().top;
        var pad = 22;
        return { x0: pad, x1: window.innerWidth - pad, y0: top + pad, y1: Math.max(top + pad, bottom - pad) };
      }

      // Resting spot from the Figma frame: bottom right of the white band
      function homeSpot() {
        var z = zone();
        return { x: z.x1 - 13, y: z.y1 - 10 };
      }

      function pickTarget() {
        var z = zone();
        // Mostly short hops, now and then a long walk
        var far = Math.random() < 0.3;
        var r = far ? 400 : 60 + Math.random() * 120;
        var a = ant.heading + (Math.random() - 0.5) * (far ? Math.PI * 2 : 2.2);
        return {
          x: Math.min(z.x1, Math.max(z.x0, ant.x + Math.cos(a) * r)),
          y: Math.min(z.y1, Math.max(z.y0, ant.y + Math.sin(a) * r))
        };
      }

      function drawAnt() {
        // A little sway while walking, like legs stepping
        var sway = ant.speed > 1 ? Math.sin(ant.phase) * 0.07 : 0;
        var angle = ant.heading - DRAWING_HEADING + sway;
        antEl.style.transform =
          "translate(" + ant.x + "px," + ant.y + "px) rotate(" + angle + "rad)";
      }

      function angleDiff(a, b) {
        var d = a - b;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
      }

      function stepAnt(dt) {
        var z = zone();

        // Run away from a cursor or finger that gets close
        if (pointer) {
          var px = ant.x - pointer.x, py = ant.y - pointer.y;
          var pd = Math.hypot(px, py);
          if (pd < 90) {
            ant.flee = 0.6;
            ant.pause = 0;
            ant.target = {
              x: Math.min(z.x1, Math.max(z.x0, ant.x + px / (pd || 1) * 160)),
              y: Math.min(z.y1, Math.max(z.y0, ant.y + py / (pd || 1) * 160))
            };
          }
        }
        ant.flee = Math.max(0, ant.flee - dt);

        if (ant.pause > 0) {
          ant.pause -= dt;
          ant.speed = Math.max(0, ant.speed - 400 * dt);
          // While standing still it sometimes turns its head
          if (Math.random() < dt * 0.8) ant.heading += (Math.random() - 0.5) * 0.6;
          return;
        }

        if (!ant.target) ant.target = pickTarget();
        var dx = ant.target.x - ant.x, dy = ant.target.y - ant.y;
        var dist = Math.hypot(dx, dy);

        if (dist < 4) {
          ant.target = null;
          // Ants stop and start: short pauses, sometimes longer ones
          ant.pause = Math.random() < 0.25 ? 1 + Math.random() * 2 : Math.random() * 0.5;
          return;
        }

        // Turn towards the target (a bit of wobble keeps the path alive)
        var want = Math.atan2(dy, dx) + Math.sin(performance.now() / 180) * 0.25;
        var turn = angleDiff(want, ant.heading);
        var maxTurn = (ant.flee ? 9 : 5) * dt;
        ant.heading += Math.max(-maxTurn, Math.min(maxTurn, turn));

        var top = ant.flee ? 230 : 70;
        var wanted = Math.abs(turn) > 1.2 ? top * 0.3 : top;
        ant.speed += (wanted - ant.speed) * Math.min(1, dt * 6);
        ant.phase += ant.speed * dt * 0.35;

        ant.x += Math.cos(ant.heading) * ant.speed * dt;
        ant.y += Math.sin(ant.heading) * ant.speed * dt;
        ant.x = Math.min(z.x1, Math.max(z.x0, ant.x));
        ant.y = Math.min(z.y1, Math.max(z.y0, ant.y));
      }

      function trackPointer(e) { pointer = { x: e.clientX, y: e.clientY }; }
      window.addEventListener("pointermove", trackPointer);
      window.addEventListener("pointerdown", trackPointer);
      window.addEventListener("pointerleave", function () { pointer = null; });
      document.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") pointer = null; });

      window.addEventListener("resize", function () {
        var z = zone();
        ant.x = Math.min(z.x1, Math.max(z.x0, ant.x));
        ant.y = Math.min(z.y1, Math.max(z.y0, ant.y));
        ant.target = null;
        drawAnt();
      });

      // ---------- Reduced motion: everything in place, the ant resting ----------
      if (reduceMotion) {
        words.forEach(function (w) { w.classList.add("is-done"); });
        panels.forEach(function (p) { p.classList.add("is-open"); });
        var spot = homeSpot();
        ant.x = spot.x; ant.y = spot.y; ant.heading = DRAWING_HEADING; // as drawn in Figma
        drawAnt();
        return;
      }

      // ---------- Entrance timeline ----------
      function later(ms, fn) { setTimeout(fn, ms); }

      function start() {
        // 1. Panels open one after another
        panels.forEach(function (p, i) { later(150 + i * 180, function () { p.classList.add("is-open"); }); });

        // 2. Words rise out of the blur
        words.forEach(function (w, i) {
          later(900 + i * 140, function () {
            w.classList.add("is-in");
            w.addEventListener("animationend", function () {
              w.classList.remove("is-in");
              w.classList.add("is-done");
            }, { once: true });
          });
        });

        // 3. The ant walks in from the right edge to its spot, then wanders
        later(1500, function () {
          var spot = homeSpot();
          ant.x = window.innerWidth + 30;
          ant.y = spot.y - 60;
          ant.heading = Math.PI;
          ant.target = spot;
          antEl.classList.add("is-on");
          drawAnt();

          var last = performance.now();
          requestAnimationFrame(function loop(now) {
            var dt = Math.min((now - last) / 1000, 0.05);
            last = now;
            // Let it step in from outside the screen before keeping it inside
            if (ant.x > window.innerWidth - 22) {
              ant.speed = 70;
              ant.phase += ant.speed * dt * 0.35;
              ant.heading += angleDiff(Math.atan2(ant.target.y - ant.y, ant.target.x - ant.x), ant.heading) * Math.min(1, dt * 4);
              ant.x += Math.cos(ant.heading) * ant.speed * dt;
              ant.y += Math.sin(ant.heading) * ant.speed * dt;
            } else {
              stepAnt(dt);
            }
            drawAnt();
            requestAnimationFrame(loop);
          });
        });
      }

      // Wait for the font so the words don't jump when it arrives
      var started = false;
      function go() { if (!started) { started = true; start(); } }
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(go); setTimeout(go, 600); }
      else go();
    })();
  </script>
</body>
</html>
